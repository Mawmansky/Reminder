.bg-layer::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(5, 5, 20, 0.2);
}
body.night .bg-layer { filter: brightness(0.6) saturate(0.85); }

.container {
  position: relative; z-index: 5;
  width: 100%; max-width: 600px;
  padding: 30px 20px;
  display: flex; flex-direction: column; align-items: center;
}

/* Hidden music player */
#ytPlayer { position: fixed; left: -9999px; top: 0; width: 200px; height: 200px; opacity: 0; pointer-events: none; }

.round-btn {
  position: fixed; top: 18px; z-index: 1000;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  font-size: 1.3rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.3s ease, background 0.3s ease;
}
.round-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.25); }
#musicToggle { right: 18px; }
#themeToggle { left: 18px; }

/* Falling petals & twinkling stars */
.petal {
  position: fixed; top: -30px; z-index: 3; pointer-events: none; opacity: 0;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(110vh) rotate(720deg) translateX(60px); opacity: 0; }
}
.twinkle {
  position: fixed; z-index: 2; pointer-events: none;
  border-radius: 50%; background: white;
  animation: twinkleAnim ease-in-out infinite;
}
@keyframes twinkleAnim {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.3); }
}

/* Heading */
.name-heading {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.2rem; font-weight: 600; color: #fff; letter-spacing: 1px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  margin: 10px 0 30px;
}
@keyframes subtlePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

/* Sun */
.sun-wrap { position: relative; width: 150px; height: 150px; margin: 30px 0 34px; }
.sun-rays {
  position: absolute; inset: -42px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,205,100,0.38) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask-image: radial-gradient(circle, transparent 36%, #000 40%, transparent 70%);
          mask-image: radial-gradient(circle, transparent 36%, #000 40%, transparent 70%);
  animation: raysSpin 30s linear infinite;
}
@keyframes raysSpin { to { transform: rotate(360deg); } }
.sun-orb {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff8d2 0%, #ffd166 45%, #ff9f43 100%);
  box-shadow: 0 0 40px #ffb347, 0 0 90px rgba(255,170,60,0.55);
  animation: orbPulse 3s ease-in-out infinite;
  transition: box-shadow 1.2s ease;
}
@keyframes orbPulse { 0%,100% { transform: scale(0.97); } 50% { transform: scale(1.04); } }
.sun-wrap.bright .sun-orb { box-shadow: 0 0 60px #ffc14d, 0 0 140px rgba(255,180,70,0.85), 0 0 220px rgba(255,150,60,0.4); }

/* Envelope */
.envelope-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 6px; }
.envelope {
  width: 120px; height: 80px; position: relative; cursor: pointer; margin-bottom: 10px;
  background: linear-gradient(135deg, #ffb347, #e8734a);
  border-radius: 4px 4px 8px 8px;
  box-shadow: 0 8px 25px rgba(255,150,70,0.5);
  transition: transform 0.3s ease;
}
.envelope:hover { transform: scale(1.05); }
.envelope .flap {
  position: absolute; top: 0; left: 0; width: 0; height: 0;
  border-left: 60px solid transparent; border-right: 60px solid transparent;
  border-top: 40px solid #f08a4b;
  transform-origin: top center; transition: transform 0.5s ease;
}
.envelope.open .flap { transform: rotateX(180deg); }
.envelope .heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -30%); font-size: 1.8rem; }
.envelope-label { color: rgba(255,255,255,0.8); font-size: 0.8rem; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

/* Message */
.message-box {
  width: 100%; display: none; margin-top: 6px;
  padding: 35px 28px; min-height: 180px;
  border: 1px solid rgba(255,209,102,0.4); border-radius: 18px;
  background: rgba(12, 8, 25, 0.68);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255,190,70,0.2), inset 0 0 15px rgba(255,209,102,0.08);
}
.message-box.show { display: block; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.message-text { font-size: 1.15rem; line-height: 1.95; color: #fff4dc; letter-spacing: 0.4px; white-space: pre-line; }
.cursor {
  display: inline-block; width: 2px; height: 1.15rem; margin-left: 2px;
  background: #fff4dc; vertical-align: text-bottom; animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

.footer-note { margin-top: 36px; color: #f0e4ff; font-size: 0.85rem; letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

/* Easter eggs */
.easter-zone { position: fixed; width: 44px; height: 44px; z-index: 500; opacity: 0; }
.secret-msg {
  position: fixed; z-index: 600; max-width: 220px; padding: 14px 20px;
  background: rgba(12,8,25,0.92); border: 1px solid rgba(255,209,102,0.5); border-radius: 14px;
  font-size: 0.9rem; color: #fff4dc; text-align: center; pointer-events: none;
  opacity: 0; transform: scale(0.8);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 8px 25px rgba(255,170,70,0.35);
}
.secret-msg.visible { opacity: 1; transform: scale(1); }

@media (max-width: 480px) { .name-heading { font-size: 1.9rem; } }

/* ===== More-for-you menu ===== */
.more-area { display: none; width: 100%; margin-top: 26px; opacity: 0; transition: opacity 1s ease; }
.more-area.show { opacity: 1; }
.more-title { font-size: 0.85rem; letter-spacing: 1px; color: #fff4dc; margin-bottom: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu-btn {
  padding: 14px 10px; border-radius: 16px; cursor: pointer;
  border: 1px solid rgba(255,209,102,0.4);
  background: rgba(12,8,25,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff4dc; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 600;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.menu-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 22px rgba(255,170,70,0.35); }

/* ===== Panels ===== */
.panel-overlay {
  position: fixed; inset: 0; z-index: 2000; padding: 20px;
  display: flex; justify-content: center; align-items: center;
  background: rgba(0,0,10,0.62);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
.panel-overlay.show { opacity: 1; pointer-events: auto; }
.panel-card {
  position: relative; width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
  padding: 38px 26px 26px; border-radius: 22px;
  background: linear-gradient(160deg, rgba(40,25,5,0.9), rgba(15,8,30,0.94));
  border: 1px solid rgba(255,209,102,0.5);
  box-shadow: 0 0 40px rgba(255,190,70,0.35), inset 0 0 25px rgba(255,209,102,0.1);
  transform: scale(0.9) translateY(20px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.panel-overlay.show .panel-card { transform: scale(1) translateY(0); }
.panel-x {
  position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
  color: #fff; font-size: 1rem; cursor: pointer;
}
.panel-card h2 { font-size: 1.15rem; font-weight: 700; color: #ffe2a8; margin-bottom: 18px; }
.panel-card p { color: #fff4dc; line-height: 1.85; font-size: 1.02rem; }
.big-emoji { font-size: 2.6rem; margin-bottom: 10px; }
.soft-btn {
  margin-top: 20px; padding: 11px 26px; border: none; border-radius: 50px; cursor: pointer;
  background: linear-gradient(135deg, #ffb347, #ff7bb5); color: #fff;
  font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem;
  box-shadow: 0 6px 18px rgba(255,150,80,0.4);
}
.list-btn {
  display: block; width: 100%; margin-bottom: 10px; padding: 13px 16px; border-radius: 14px; cursor: pointer;
  border: 1px solid rgba(255,209,102,0.35); background: rgba(255,255,255,0.06);
  color: #fff4dc; font-family: 'Montserrat', sans-serif; font-size: 0.92rem; text-align: left;
}
.list-btn:hover { background: rgba(255,209,102,0.15); }
.mood-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
.mood-btn {
  flex: 1; padding: 10px 2px; border-radius: 14px; cursor: pointer;
  border: 1px solid rgba(255,209,102,0.35); background: rgba(255,255,255,0.06);
  color: #fff4dc; font-size: 1.7rem; font-family: inherit;
}
.mood-btn span { display: block; font-size: 0.62rem; margin-top: 4px; font-family: 'Montserrat', sans-serif; }
.date-line { font-size: 0.78rem; letter-spacing: 1px; color: #e6c98c; margin-bottom: 14px; }
.small-note { font-size: 0.78rem !important; color: #d8c9a8 !important; margin-top: 14px; }

/* Breathing */
.breath-wrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0 4px; }
.breath-circle {
  width: 120px; height: 120px; border-radius: 50%; margin: 30px 0 40px;
  background: radial-gradient(circle at 35% 35%, #fff8d2, #ffd166 55%, #ff9f43);
  box-shadow: 0 0 40px rgba(255,180,70,0.7);
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { transform: scale(0.8); } 50% { transform: scale(1.5); } }
.breath-label { font-size: 1.1rem; color: #fff4dc; min-height: 1.6em; }

/* Star game */
.game-overlay { position: fixed; inset: 0; z-index: 2500; display: none; background: rgba(3,4,14,0.55); touch-action: none; }
.game-overlay.show { display: block; }
.game-hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 16px 70px 16px 18px;
  display: flex; gap: 22px; font-size: 1rem; color: #fff4dc; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}
.game-hud .panel-x { top: 12px; right: 14px; }
.g-star {
  position: absolute; top: -50px; font-size: 2.2rem; padding: 8px; cursor: pointer; user-select: none;
  animation-name: starDrop; animation-timing-function: linear; animation-fill-mode: forwards;
  filter: drop-shadow(0 0 10px rgba(255,220,120,0.9));
}
@keyframes starDrop { to { transform: translateY(115vh) rotate(180deg); } }
.g-pop {
  position: absolute; z-index: 4; pointer-events: none; font-weight: 700; font-size: 0.95rem; color: #fff;
  text-shadow: 0 0 10px #ffb347, 0 0 20px #ffb347; animation: gPop 1.1s ease-out forwards; white-space: nowrap;
}
@keyframes gPop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-55px) scale(1.2); } }
.game-end {
  position: absolute; inset: 0; z-index: 5; display: none; justify-content: center; align-items: center; padding: 20px;
  background: rgba(0,0,10,0.6);
}
.game-end.show { display: flex; }

/* Shooting star + toast */
.shoot {
  position: fixed; z-index: 8; font-size: 2.2rem; padding: 12px; cursor: pointer;
  animation: shootAnim 3.2s linear forwards; filter: drop-shadow(0 0 12px rgba(255,255,255,0.9));
}
@keyframes shootAnim {
  0%   { transform: translate(0,0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translate(-70vw, 55vh); opacity: 0; }
}
.toast {
  position: fixed; left: 50%; bottom: 40px; z-index: 3000; max-width: 320px; width: calc(100% - 40px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; text-align: center;
  padding: 14px 18px; border-radius: 16px; font-size: 0.92rem; line-height: 1.6; color: #fff4dc;
  background: rgba(12,8,25,0.9); border: 1px solid rgba(255,209,102,0.5);
  box-shadow: 0 8px 25px rgba(255,170,70,0.35); transition: all 0.4s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.special-btn { grid-column: 1 / -1; font-size: 0.95rem; border-color: rgba(255,209,102,0.85);
  background: linear-gradient(135deg, rgba(255,179,71,0.3), rgba(255,123,181,0.3)); }
body.cosmic #musicToggle { z-index: 2700; opacity: 0.5; }
#cosmos { position: fixed; inset: 0; z-index: 2600; background: #000; display: none; opacity: 0; transition: opacity 1.6s ease; cursor: pointer; }
#cosmos.on { display: block; } #cosmos.show { opacity: 1; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.cap { position: absolute; top: 24px; left: 0; right: 0; padding: 0 56px; text-align: center; opacity: 0; transition: opacity 0.8s;
  font: 0.72rem/1.7 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1.5px; color: #8fd3ff; }
.dlg { position: absolute; left: 0; right: 0; bottom: 7vh; padding: 0 26px; text-align: center; transition: opacity 0.45s; }
.dq { min-height: 1.7em; font-size: 1.05rem; line-height: 1.6; color: #cfd8e8; }
.da { min-height: 2.4em; margin-top: 10px; font-size: 1.45rem; font-weight: 700; line-height: 1.4; color: #ffd166; text-shadow: 0 0 18px rgba(255,190,70,0.7); }
.rbtn { margin-top: 18px; padding: 10px 24px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08);
  color: #fff; font-family: 'Montserrat', sans-serif; font-size: 0.85rem; cursor: pointer; }

.cap, .dlg { z-index: 5; }
#cv { transition: opacity 2s ease; }
#cosmos .petal { z-index: 3; }
#artFrame { position: absolute; left: 50%; top: 50%; z-index: 2; width: min(92vw, 880px); aspect-ratio: 1376 / 768;
  transform: translate(-50%, -58%) scale(0.94); opacity: 0; pointer-events: none; border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(255,209,102,0.5); box-shadow: 0 0 40px rgba(255,190,110,0.45), 0 0 120px rgba(150,120,255,0.3);
  transition: opacity 2.4s ease, transform 4s ease; }
#artFrame.show { opacity: 1; transform: translate(-50%, -58%) scale(1); }
#artFrame img { width: 100%; height: 100%; display: block; object-fit: cover; clip-path: circle(0% at 50% 50%); transition: clip-path 3.4s ease; }
#artFrame.show img { clip-path: circle(80% at 50% 50%); }

.addr-line { opacity: 0; transform: translateY(8px); animation: addrIn 0.8s ease forwards; padding: 7px 0; color: #fff4dc; font-size: 1rem; }
.addr-line:first-child { color: #ffd166; font-weight: 700; }
@keyframes addrIn { to { opacity: 1; transform: none; } }
.ages { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; }
.ages div { flex: 1; padding: 8px 2px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,209,102,0.3); font-size: 0.68rem; color: #e6c98c; }
.ages b { display: block; font-size: 1.05rem; color: #fff4dc; margin-top: 3px; }
</style>

const SONG_ID = '4g6cbS_J1Ik';
let player, musicPlaying = false, playerReady = false;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('ytPlayer', {
    height: '200', width: '200',
    videoId: SONG_ID,
    playerVars: { autoplay: 0, loop: 1, playlist: SONG_ID, playsinline: 1 },
    events: {
      onReady: e => { playerReady = true; e.target.setVolume(65); },
      onStateChange: e => {
        musicPlaying = (e.data === YT.PlayerState.PLAYING);
        document.getElementById('musicToggle').textContent = musicPlaying ? '🎵' : '🔇';
      }
    }
  });
}
const ytTag = document.createElement('script');
ytTag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytTag);

function startMusic() { if (playerReady && !musicPlaying) player.playVideo(); }
function toggleMusic() {
  if (!playerReady) return;
  if (musicPlaying) player.pauseVideo(); else player.playVideo();
}

// ===== Day / night =====
let isNight = false;
function toggleTheme() {
  isNight = !isNight;
  document.body.classList.toggle('night', isNight);
  document.getElementById('themeToggle').textContent = isNight ? '☀️' : '🌙';
}

const messageContent = `And because I'm always proud of you, and proud of the effort you put into everything, I've got to remind you that you, without a sin, are like the sun, and even with your sins, you are like the sun. ☀️`;

  startMusic();
  document.getElementById('envelope').classList.add('open');
  setTimeout(() => {
    document.getElementById('envelopeArea').style.display = 'none';
    document.getElementById('messageBox').classList.add('show');
    const msgEl = document.getElementById('simpleMessage');
    let i = 0;
    (function typeWriter() {
      if (i < messageContent.length) {
        msgEl.textContent += messageContent.charAt(i++);

      } else {
        document.getElementById('cursor').style.display = 'none'; showMenu();
      }
    })();
  }, 600);
}

const CATCH_LINES = ["You shine ✨", "So proud of you", "You're enough", "Breathe 🌿", "Keep going 💛", "You're loved", "Look at you go!", "Be gentle with yourself", "So brave", "Bright as the sun ☀️"];

function showMenu() {
  const m = document.getElementById('moreArea');
  m.style.display = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('show')));
}

const body = () => document.getElementById('panelBody');

function openPanel() {
  body().innerHTML = `<div class="big-emoji">💛</div><h2>Reasons I'm proud of you</h2><p>${REASONS[0]}</p>`;
  document.getElementById('panelOverlay').classList.add('show');
}
function closePanel() {
  document.getElementById('panelOverlay').classList.remove('show');
}

// =====================================================
//  Star-catching game
// =====================================================
let gTimer = null, gSpawn = null, gScore = 0, gLeft = 30;
function openGame() {
  closePanel();
  document.getElementById('gameOverlay').classList.add('show');
  document.getElementById('gameEnd').classList.remove('show');
  document.getElementById('gameArea').innerHTML = '';
  gScore = 0; gLeft = 30; updateHud();
  clearInterval(gTimer); clearInterval(gSpawn);
  gSpawn = setInterval(spawnStar, 650);
  gTimer = setInterval(() => { gLeft--; updateHud(); if (gLeft <= 0) endGame(false); }, 1000);
}
function updateHud() {
  document.getElementById('gScore').textContent = gScore;
  document.getElementById('gTime').textContent = Math.max(gLeft, 0);
}
function spawnStar() {
  const area = document.getElementById('gameArea');
  const s = document.createElement('div');
  s.className = 'g-star';
  s.textContent = ['⭐', '🌟', '✨', '💫'][Math.floor(Math.random() * 4)];
  s.style.left = (Math.random() * 82 + 3) + 'vw';
  const dur = Math.random() * 2 + 3.2;
  s.style.animationDuration = dur + 's';
  s.addEventListener('pointerdown', e => { e.preventDefault(); catchStar(s); });
  area.appendChild(s);
  setTimeout(() => s.remove(), dur * 1000 + 100);
}
function catchStar(s) {
  if (!s.isConnected) return;
  const r = s.getBoundingClientRect();
  s.remove();
  gScore++; updateHud();
  const pop = document.createElement('div');
  pop.className = 'g-pop';
  pop.textContent = CATCH_LINES[Math.floor(Math.random() * CATCH_LINES.length)];
  pop.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
  pop.style.top = r.top + 'px';
  document.getElementById('gameArea').appendChild(pop);
  setTimeout(() => pop.remove(), 1100);
}
function endGame(quit) {
  clearInterval(gTimer); clearInterval(gSpawn);
  document.getElementById('gameArea').innerHTML = '';
  if (quit) { document.getElementById('gameOverlay').classList.remove('show'); document.getElementById('gameEnd').classList.remove('show'); return; }
  const end = document.getElementById('gameEnd');
  end.innerHTML = `<div class="panel-card" style="text-align:center"><div class="big-emoji">🌟</div><h2>You caught ${gScore} stars!</h2>` +
    `<p>Every single one is a little reminder that you shine. ✨</p>` +
    `<button class="soft-btn" onclick="openGame()">Play again</button> ` +
    `<button class="soft-btn" style="background:rgba(255,255,255,0.15);box-shadow:none" onclick="endGame(true)">Close</button></div>`;
  end.classList.add('show');
}

function sizeCv() { dpr = window.devicePixelRatio || 1; CW = innerWidth; CH = innerHeight; cvs.width = CW * dpr; cvs.height = CH * dpr; }
function setScene(n) { if (n === scName) return; scName = n; scObj = SC[n]; scObj.init && scObj.init(); t0 = performance.now(); }
function frame(now) {
  if (!window.cosmosOn) return;
  const t = (now - t0) / 1000, c = cx2;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, CW, CH);
  c.globalAlpha = Math.min(1, t / 1.2);
  if (scName !== 'sky') bgStars.forEach(s => { c.globalAlpha = Math.min(1, t / 1.2) * (.3 + .4 * Math.sin(now / 900 + s.o)); dot(c, s.x * CW, s.y * CH, s.r, '#fff'); });
  c.globalAlpha = Math.min(1, t / 1.2); scObj.draw(c, t, CW, CH, curI); c.globalAlpha = 1;

let typer = null, waitT = null, ended = false;
function typeInto(el, txt, ms, done) {
  let i = 0; el.textContent = '';
  const o = typer = { finish() { clearInterval(o.iv); el.textContent = txt; typer = null; done(); } };
  o.iv = setInterval(() => { el.textContent = txt.slice(0, ++i); if (i >= txt.length) o.finish(); }, ms);
}
function playPair(i) {
  if (i >= DLG.length) return finishCosmos();
  curI = i; const [q, a, cap, sc] = DLG[i];
  setScene(sc);
  const capEl = document.getElementById('cap'); capEl.style.opacity = 0;
  setTimeout(() => { capEl.textContent = cap; capEl.style.opacity = cap ? 1 : 0; }, 300);
  document.getElementById('dq').textContent = ''; document.getElementById('da').textContent = '';
  typeInto(document.getElementById('dq'), q, 28, () => setTimeout(() => {
    typeInto(document.getElementById('da'), a, 50, () => { waitT = setTimeout(nextPair, 1700 + a.length * 45); });
  }, 450));
}
function nextPair() {
  waitT = null; const d = document.getElementById('dlg'); d.style.opacity = 0;

}

  ended = true;

  document.getElementById('dq').textContent = ''; da.textContent = ''; capEl.style.opacity = 0;
  setTimeout(() => { capEl.textContent = 'Drawn by Hadjerdjer ✨'; capEl.style.opacity = 1; }, 600);

  }), 3800);
}

function drawBirthSky(cv) {
  const S = cv.width, c = cv.getContext('2d'), m = S / 2, R = m - 16, rad = Math.PI / 180, f = BIRTH.lat * rad;

  const g = c.createRadialGradient(m, m, R * .1, m, m, R); g.addColorStop(0, '#111c3d'); g.addColorStop(1, '#03050f');

    const alt = Math.asin(Math.sin(d) * Math.sin(f) + Math.cos(d) * Math.cos(f) * Math.cos(H));
    if (alt <= 0) return;
    const az = Math.atan2(-Math.sin(H) * Math.cos(d), Math.sin(d) * Math.cos(f) - Math.cos(d) * Math.sin(f) * Math.cos(H));

  });

    `<canvas id="skyCv" width="340" height="340" style="width:100%;max-width:340px;border-radius:50%"></canvas>` +
    `<div class="date-line" style="margin-top:12px">ALGIERS · 14 JUNE 2001 · 10 PM</div>` +
    `<p>${mo.icon} The Moon was about ${mo.pct}% lit and ${mo.waning ? 'waning' : 'waxing'}.</p>` +
    `<p style="margin-top:12px">⭐ Vega is 25 light-years away. The light you see from it tonight left it in ${left}${left === 2001 ? ', the year you were born' : ''}.</p>`;
  document.getElementById('panelOverlay').classList.add('show');
  drawBirthSky(document.getElementById('skyCv'));
}

const ADDRESS = ['Hadjerdjer, you are here ✨', 'Algeria', 'Earth', 'The Solar System', 'The Milky Way', 'The Local Group', 'The Laniakea Supercluster', 'The Observable Universe'];
function openAddress() {
  const yrs = (Date.now() - Date.UTC(2001, 5, 14)) / (365.25 * 86400000);
  const pl = [['Mercury', .2408], ['Venus', .6152], ['Mars', 1.8808], ['Jupiter', 11.862], ['Saturn', 29.457]];
  body().innerHTML = `<h2>🪐 Your cosmic address</h2>` +
    ADDRESS.map((a, i) => `<div class="addr-line" style="animation-delay:${i * .75}s">${i ? '↓ ' : ''}${a}</div>`).join('') +
    `<div class="addr-line" style="animation-delay:${ADDRESS.length * .75}s;margin-top:8px">…and out of all of it, there's only one you.</div>` +
    `<div class="date-line" style="margin-top:18px">YOUR AGE ON OTHER PLANETS</div><div class="ages">` +
    pl.map(([n, p]) => `<div>${n}<b>${(yrs / p).toFixed(1)}</b></div>`).join('') + `</div>`;
  document.getElementById('panelOverlay').classList.add('show');
}
</script>
</body>
</html>
